name: Tune RA-CDiff locality

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/augmentation-tune-locality.yml'

permissions:
  contents: write

jobs:
  tune-locality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Pouch lower-noise RA-CDiff
        run: |
          rm -rf data/synthetic/pouch_clean_racdiff_v2_local reports/augmentation_quality_pouch_v2_local
          python scripts/train_diffusion_v3_anchored.py \
            --input data/processed/pouch_clean_v1/cell_pouch_temp_force_clean.npz \
            --out data/synthetic/pouch_clean_racdiff_v2_local \
            --steps 1200 --diffusion-steps 100 --batch-size 64 --hidden 32 \
            --candidates 360 --noise-min 0.10 --noise-max 0.35 --seed 2027
          python scripts/evaluate_augmentation_quality.py \
            --real data/processed/pouch_clean_v1/cell_pouch_temp_force_clean.npz \
            --synthetic data/synthetic/pouch_clean_racdiff_v2_local/synthetic_windows.npz \
            --quality-csv data/synthetic/pouch_clean_racdiff_v2_local/synthetic_quality.csv \
            --pilot-json data/synthetic/pouch_clean_racdiff_v2_local/report.json \
            --out reports/augmentation_quality_pouch_v2_local
          cat data/synthetic/pouch_clean_racdiff_v2_local/report.md
          cat reports/augmentation_quality_pouch_v2_local/augmentation_quality.md
          rm -f data/synthetic/pouch_clean_racdiff_v2_local/model.pt

      - name: Module lower-noise RA-CDiff
        run: |
          rm -rf data/synthetic/module_racdiff_v2_local reports/augmentation_quality_module_v2_local
          python scripts/train_diffusion_v3_anchored.py \
            --input data/processed/module_aligned_v1/module_temp4_force.npz \
            --out data/synthetic/module_racdiff_v2_local \
            --steps 1200 --diffusion-steps 100 --batch-size 64 --hidden 32 \
            --candidates 360 --noise-min 0.08 --noise-max 0.25 --seed 2028
          python scripts/evaluate_augmentation_quality.py \
            --real data/processed/module_aligned_v1/module_temp4_force.npz \
            --synthetic data/synthetic/module_racdiff_v2_local/synthetic_windows.npz \
            --quality-csv data/synthetic/module_racdiff_v2_local/synthetic_quality.csv \
            --pilot-json data/synthetic/module_racdiff_v2_local/report.json \
            --out reports/augmentation_quality_module_v2_local
          cat data/synthetic/module_racdiff_v2_local/report.md
          cat reports/augmentation_quality_module_v2_local/augmentation_quality.md
          rm -f data/synthetic/module_racdiff_v2_local/model.pt

      - name: Commit tuned outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/synthetic/pouch_clean_racdiff_v2_local data/synthetic/module_racdiff_v2_local \
                  reports/augmentation_quality_pouch_v2_local reports/augmentation_quality_module_v2_local
          if git diff --cached --quiet; then
            echo 'No tuning changes to commit.'
            exit 0
          fi
          git commit -m 'data: add lower-noise RA-CDiff locality tuning'
          git pull --rebase origin main
          git push origin HEAD:main
