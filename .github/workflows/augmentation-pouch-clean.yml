name: Clean pouch-cell RA-CDiff augmentation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/prepare_pouch_clean_windows.py'
      - 'scripts/train_diffusion_v3_anchored.py'
      - 'scripts/evaluate_augmentation_quality.py'
      - '.github/workflows/augmentation-pouch-clean.yml'

concurrency:
  group: augmentation-pouch-clean-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  augment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare conservative pouch cohort
        run: |
          rm -rf data/processed/pouch_clean_v1
          python scripts/prepare_pouch_clean_windows.py \
            --out data/processed/pouch_clean_v1 \
            --window 256 --stride 64
          cat data/processed/pouch_clean_v1/summary.json
      - name: Train real-anchored diffusion and generate local variants
        run: |
          rm -rf data/synthetic/pouch_clean_racdiff_v1
          python scripts/train_diffusion_v3_anchored.py \
            --input data/processed/pouch_clean_v1/cell_pouch_temp_force_clean.npz \
            --out data/synthetic/pouch_clean_racdiff_v1 \
            --steps 1200 \
            --diffusion-steps 100 \
            --batch-size 64 \
            --hidden 32 \
            --candidates 360 \
            --noise-min 0.20 \
            --noise-max 0.50 \
            --seed 2027
          cat data/synthetic/pouch_clean_racdiff_v1/report.md
      - name: Evaluate accepted synthetic windows
        run: |
          rm -rf reports/augmentation_quality_pouch_clean
          python scripts/evaluate_augmentation_quality.py \
            --real data/processed/pouch_clean_v1/cell_pouch_temp_force_clean.npz \
            --synthetic data/synthetic/pouch_clean_racdiff_v1/synthetic_windows.npz \
            --quality-csv data/synthetic/pouch_clean_racdiff_v1/synthetic_quality.csv \
            --pilot-json data/synthetic/pouch_clean_racdiff_v1/report.json \
            --out reports/augmentation_quality_pouch_clean
          cat reports/augmentation_quality_pouch_clean/augmentation_quality.md
      - name: Remove checkpoint before commit
        run: rm -f data/synthetic/pouch_clean_racdiff_v1/model.pt
      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/pouch_clean_v1 data/synthetic/pouch_clean_racdiff_v1 reports/augmentation_quality_pouch_clean
          if git diff --cached --quiet; then
            echo 'No pouch augmentation changes to commit.'
            exit 0
          fi
          git commit -m 'data: add cleaned pouch-cell RA-CDiff augmentation'
          git pull --rebase origin main
          git push origin HEAD:main
