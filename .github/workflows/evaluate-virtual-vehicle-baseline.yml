name: Evaluate frozen Virtual Vehicle baseline

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/evaluate_virtual_vehicle_baseline.py'
      - 'reports/virtual_vehicle_validation_protocol_freeze.md'
      - '.github/workflows/evaluate-virtual-vehicle-baseline.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas requests remotezip openpyxl scikit-learn
      - name: Run frozen real-only LOEO baseline
        run: |
          rm -rf reports/virtual_vehicle_baseline
          python scripts/evaluate_virtual_vehicle_baseline.py --out reports/virtual_vehicle_baseline
      - name: Commit baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/virtual_vehicle_baseline
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: add frozen Virtual Vehicle real-only baseline'
          git pull --rebase origin main
          git push origin HEAD:main
