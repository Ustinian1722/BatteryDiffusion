name: Inspect selected Virtual Vehicle 21700 files

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_external_virtual_vehicle_selected.py'
      - '.github/workflows/inspect-external-virtual-vehicle-selected.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas requests remotezip openpyxl
      - name: Range-extract selected compact files
        run: |
          rm -rf reports/external_virtual_vehicle_21700/selected_inspection
          python scripts/inspect_external_virtual_vehicle_selected.py --out reports/external_virtual_vehicle_21700/selected_inspection
      - name: Commit inspection summaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/external_virtual_vehicle_21700/selected_inspection
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: inspect selected Virtual Vehicle event files'
          git pull --rebase origin main
          git push origin HEAD:main
