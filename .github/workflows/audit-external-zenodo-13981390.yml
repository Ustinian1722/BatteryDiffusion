name: Audit external Zenodo thermo-pressure data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_external_zenodo_13981390.py'
      - '.github/workflows/audit-external-zenodo-13981390.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy requests h5py
      - name: Download temporarily and audit schema
        run: |
          rm -rf reports/external_zenodo_13981390
          python scripts/audit_external_zenodo_13981390.py
          cat reports/external_zenodo_13981390/README.md
      - name: Commit audit only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/external_zenodo_13981390
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: audit external Zenodo thermo-pressure dataset'
          git pull --rebase origin main
          git push origin HEAD:main
