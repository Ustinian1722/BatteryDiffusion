name: Scan thermally subtle early-warning regimes

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scan_early_warning_regimes.py'
      - '.github/workflows/scan-early-warning-regimes.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas openpyxl scikit-learn
      - name: Scan definitions
        run: |
          rm -rf reports/early_warning_regime_scan
          python scripts/scan_early_warning_regimes.py --window 256 --stride 10
          cat reports/early_warning_regime_scan/README.md
      - name: Commit scan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/early_warning_regime_scan
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: scan thermally subtle early-warning definitions'
          git pull --rebase origin main
          git push origin HEAD:main
