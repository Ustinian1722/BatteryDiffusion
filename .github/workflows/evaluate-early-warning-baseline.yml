name: Evaluate real-only impending-vent baseline

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/evaluate_early_warning_baseline.py'
      - '.github/workflows/evaluate-early-warning-baseline.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas openpyxl scikit-learn
      - name: Run leakage-safe real-only baseline
        run: |
          rm -rf reports/early_warning_baseline
          python scripts/evaluate_early_warning_baseline.py --window 256 --stride 10 --horizon 300
          cat reports/early_warning_baseline/README.md
      - name: Commit baseline results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/early_warning_baseline
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: add real-only impending-vent baseline'
          git pull --rebase origin main
          git push origin HEAD:main
