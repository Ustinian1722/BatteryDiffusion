name: Audit remaining cohorts

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_remaining_cohorts.py'
      - '.github/workflows/audit-remaining-cohorts.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas openpyxl
      - name: Run remaining-cohort audit
        run: |
          rm -rf reports/remaining_cohort_audit
          python scripts/audit_remaining_cohorts.py
          cat reports/remaining_cohort_audit/README.md
      - name: Commit audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/remaining_cohort_audit
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git commit -m 'data: audit remaining cohort alignment and gaps'
          git push origin HEAD:main
