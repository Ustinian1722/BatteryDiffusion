name: Evaluate frozen LATH-Net v3

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/evaluate_lath_v3_fold.py'
      - 'reports/method_paper_target_freeze_v3.md'
      - '.github/workflows/evaluate-lath-v3.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fold:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        held: [TS0330A, TS0330B, TS0330C, TS0330D, TS0330E, TS0330F, TS0330G, TS0330H]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests remotezip openpyxl scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen LATH-Net v3 fold
        run: |
          python scripts/evaluate_lath_v3_fold.py \
            --heldout ${{ matrix.held }} \
            --out out/${{ matrix.held }} \
            --seeds 2026 2027 2028
      - uses: actions/upload-artifact@v4
        with:
          name: lath-v3-${{ matrix.held }}
          path: out/${{ matrix.held }}/
          retention-days: 3

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: lath-v3-*
          path: collected
      - name: Aggregate v3 results
        run: |
          rm -rf reports/lath_v3_benchmark
          mkdir -p reports/lath_v3_benchmark/fold_audits
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('collected'); out=Path('reports/lath_v3_benchmark')
          fs=sorted(root.glob('*/metrics.csv'))
          if len(fs)!=8: raise RuntimeError(f'expected 8 folds, got {len(fs)}')
          m=pd.concat([pd.read_csv(p) for p in fs],ignore_index=True); m.to_csv(out/'all_seed_metrics.csv',index=False)
          pred=sorted(root.glob('*/predictions.csv'))
          if pred: pd.concat([pd.read_csv(p) for p in pred],ignore_index=True).to_csv(out/'all_predictions.csv',index=False)
          diag=sorted(root.glob('*/mechanism_diagnostics.csv'))
          if diag:
              d=pd.concat([pd.read_csv(p) for p in diag],ignore_index=True); d.to_csv(out/'mechanism_diagnostics.csv',index=False)
              cols=[c for c in d.columns if c.startswith('lag_weight_') or c in ('reliability_mean','lag_max_weight_mean','lag_entropy_norm_mean','lag_sharpness')]
              d.groupby('tau_band_s')[cols].mean().reset_index().to_csv(out/'mechanism_by_tau_band.csv',index=False)
          for p in root.glob('*/audit.json'):
              (out/'fold_audits'/f'{p.parent.name}.json').write_text(p.read_text(encoding='utf-8'),encoding='utf-8')

          held=m.groupby('heldout').agg(
              seeds=('seed','size'),mae_s=('mae_s','mean'),rmse_s=('rmse_s','mean'),medae_s=('medae_s','mean'),
              r2=('r2','mean'),bias_s=('bias_s','mean'),lag_max_weight=('lag_max_weight_mean','mean'),
              lag_entropy=('lag_entropy_norm_mean','mean'),reliability=('reliability_mean','mean'),params=('params','mean')
          ).reset_index(); held.to_csv(out/'heldout_metrics.csv',index=False)
          horizons=[]
          for h in (60,120,180,300,450):
              cols=[f'auroc_{h}',f'auprc_{h}',f'brier_{h}']; t=m.groupby('heldout')[cols].mean(numeric_only=True)
              horizons.append({'horizon_s':h,'auroc_macro':t[f'auroc_{h}'].mean(),'auprc_macro':t[f'auprc_{h}'].mean(),'brier_macro':t[f'brier_{h}'].mean()})
          hdf=pd.DataFrame(horizons); hdf.to_csv(out/'horizon_metrics.csv',index=False)

          lines=['# LATH-Net v3 frozen benchmark','',
                 'V3 was frozen before scoring after v2 exposed uniform lag weights and cross-experiment calibration error. Task/splits are unchanged; no augmentation is used.','',
                 f'- Experiment-macro MAE: **{held.mae_s.mean():.2f} s**',
                 f'- Worst held-out MAE: **{held.mae_s.max():.2f} s**',
                 f'- Experiment-macro RMSE: **{held.rmse_s.mean():.2f} s**',
                 f'- Experiment-macro MedAE: **{held.medae_s.mean():.2f} s**',
                 f'- Experiment-macro R2: **{held.r2.mean():.4f}**',
                 f'- Mean max lag weight: **{held.lag_max_weight.mean():.3f}** (uniform reference = 0.167)',
                 f'- Mean normalized lag entropy: **{held.lag_entropy.mean():.3f}** (uniform reference = 1.000)',
                 f'- Mean pressure reliability gate: **{held.reliability.mean():.3f}**','',
                 '| heldout | MAE | RMSE | R2 | bias | max lag w | lag entropy | reliability |','|---|---:|---:|---:|---:|---:|---:|---:|']
          for _,r in held.iterrows(): lines.append(f"| {r.heldout} | {r.mae_s:.2f} | {r.rmse_s:.2f} | {r.r2:.4f} | {r.bias_s:.2f} | {r.lag_max_weight:.3f} | {r.lag_entropy:.3f} | {r.reliability:.3f} |")
          lines += ['', '## Multi-horizon auxiliary warning','', '| horizon | AUROC | AUPRC | Brier |','|---:|---:|---:|---:|']
          for _,r in hdf.iterrows(): lines.append(f"| {int(r.horizon_s)} s | {r.auroc_macro:.3f} | {r.auprc_macro:.3f} | {r.brier_macro:.4f} |")
          lines += ['', '## Predeclared development gate','',
                    'RF exact-fold reference: mean MAE 40.42 s, worst 62.90 s. V1 LATH reference: mean MAE 37.4 s. V3 proceeds to full ablation only if predictive performance and lag-mechanism diagnostics jointly justify it. Statistical n remains eight real destructive experiments.']
          (out/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8'); print('\n'.join(lines))
          PY
      - name: Commit v3 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add reports/lath_v3_benchmark
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: add frozen LATH-Net v3 benchmark results'
          git push origin HEAD:main
