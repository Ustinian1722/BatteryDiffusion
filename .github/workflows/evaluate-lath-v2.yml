name: Evaluate frozen LATH-Net v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/evaluate_lath_v2_fold.py'
      - 'reports/method_paper_target_freeze_v2.md'
      - '.github/workflows/evaluate-lath-v2.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fold:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        held: [TS0330A, TS0330B, TS0330C, TS0330D, TS0330E, TS0330F, TS0330G, TS0330H]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests remotezip openpyxl scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen LATH-Net v2 fold
        run: |
          python scripts/evaluate_lath_v2_fold.py \
            --heldout ${{ matrix.held }} \
            --out out/${{ matrix.held }} \
            --seeds 2026 2027 2028
      - uses: actions/upload-artifact@v4
        with:
          name: lath-v2-${{ matrix.held }}
          path: out/${{ matrix.held }}/
          retention-days: 3

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: lath-v2-*
          path: collected
      - name: Aggregate experiment-level metrics and mechanism diagnostics
        run: |
          rm -rf reports/lath_v2_benchmark
          mkdir -p reports/lath_v2_benchmark/fold_audits
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import numpy as np

          root=Path('collected')
          out=Path('reports/lath_v2_benchmark')
          metric_files=sorted(root.glob('*/metrics.csv'))
          pred_files=sorted(root.glob('*/predictions.csv'))
          diag_files=sorted(root.glob('*/mechanism_diagnostics.csv'))
          if len(metric_files)!=8:
              raise RuntimeError(f'expected 8 metric files, got {len(metric_files)}')
          m=pd.concat([pd.read_csv(p) for p in metric_files],ignore_index=True)
          m.to_csv(out/'all_seed_metrics.csv',index=False)
          if pred_files:
              pd.concat([pd.read_csv(p) for p in pred_files],ignore_index=True).to_csv(out/'all_predictions.csv',index=False)
          if diag_files:
              d=pd.concat([pd.read_csv(p) for p in diag_files],ignore_index=True)
              d.to_csv(out/'mechanism_diagnostics.csv',index=False)
              cols=[c for c in d.columns if c.startswith('lag_weight_') or c=='gate_mean']
              mech=d.groupby('tau_band_s')[cols].mean().reset_index()
              mech.to_csv(out/'mechanism_by_tau_band.csv',index=False)
          for p in root.glob('*/audit.json'):
              dest=out/'fold_audits'/f'{p.parent.name}.json'
              dest.write_text(p.read_text(encoding='utf-8'),encoding='utf-8')

          held=m.groupby('heldout').agg(
              seeds=('seed','size'),
              mae_s=('mae_s','mean'),
              rmse_s=('rmse_s','mean'),
              medae_s=('medae_s','mean'),
              r2=('r2','mean'),
              bias_s=('bias_s','mean'),
              params=('params','mean'),
              epochs=('epochs','mean'),
          ).reset_index()
          held.to_csv(out/'heldout_metrics.csv',index=False)
          macro={
              'mae_mean_s':held.mae_s.mean(),
              'mae_std_across_experiments_s':held.mae_s.std(ddof=1),
              'mae_worst_s':held.mae_s.max(),
              'rmse_mean_s':held.rmse_s.mean(),
              'medae_mean_s':held.medae_s.mean(),
              'r2_mean':held.r2.mean(),
              'bias_mean_s':held.bias_s.mean(),
              'params_mean':held.params.mean(),
          }
          hm=[]
          for h in (60,120,180,300,450):
              cols=[f'auroc_{h}',f'auprc_{h}',f'brier_{h}']
              temp=m.groupby('heldout')[cols].mean(numeric_only=True)
              hm.append({'horizon_s':h,
                         'auroc_macro':temp[f'auroc_{h}'].mean(),
                         'auprc_macro':temp[f'auprc_{h}'].mean(),
                         'brier_macro':temp[f'brier_{h}'].mean()})
          hdf=pd.DataFrame(hm); hdf.to_csv(out/'horizon_metrics.csv',index=False)

          lines=['# LATH-Net v2 frozen benchmark','',
                 'Protocol frozen before v2 scores: 120 s causal temperature+pressure context, 0<time-to-first-`vent_gas`<=600 s, max input temperature <=150 C. One independent experiment is test, the next cyclic experiment is validation, and six experiments are training. Three fixed seeds are averaged within each held-out experiment.','',
                 '## TTV headline metrics','',
                 f"- Experiment-macro MAE: **{macro['mae_mean_s']:.2f} s**",
                 f"- Worst held-out-experiment MAE: **{macro['mae_worst_s']:.2f} s**",
                 f"- Experiment-macro RMSE: **{macro['rmse_mean_s']:.2f} s**",
                 f"- Experiment-macro MedAE: **{macro['medae_mean_s']:.2f} s**",
                 f"- Experiment-macro R2: **{macro['r2_mean']:.4f}**",'',
                 '| held-out | MAE | RMSE | MedAE | R2 | bias |','|---|---:|---:|---:|---:|---:|']
          for _,r in held.iterrows():
              lines.append(f"| {r.heldout} | {r.mae_s:.2f} | {r.rmse_s:.2f} | {r.medae_s:.2f} | {r.r2:.4f} | {r.bias_s:.2f} |")
          lines += ['', '## Multi-horizon risk', '', '| horizon | AUROC | AUPRC | Brier |','|---:|---:|---:|---:|']
          for _,r in hdf.iterrows():
              lines.append(f"| {int(r.horizon_s)} s | {r.auroc_macro:.3f} | {r.auprc_macro:.3f} | {r.brier_macro:.4f} |")
          lines += ['', '## Guardrail','',
                    'The statistical unit is the independent destructive experiment (n=8), not individual windows or seeds. This report is the frozen full-model result only; ablations remain separate and augmentation is not used here.']
          (out/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit LATH-Net v2 results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/lath_v2_benchmark
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: add frozen LATH-Net v2 benchmark results'
          git pull --rebase origin main
          git push origin HEAD:main
