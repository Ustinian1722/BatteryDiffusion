name: Analyze external Zenodo thermo-pressure events

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_external_zenodo_13981390_events.py'
      - '.github/workflows/analyze-external-zenodo-events.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy requests
      - name: Download transiently and analyze event structure
        run: |
          rm -rf reports/external_zenodo_13981390/event_analysis
          python scripts/analyze_external_zenodo_13981390_events.py
          cat reports/external_zenodo_13981390/event_analysis/README.md
      - name: Commit analysis only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/external_zenodo_13981390/event_analysis
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: analyze external Zenodo thermo-pressure event structure'
          git pull --rebase origin main
          git push origin HEAD:main
