name: Audit Virtual Vehicle time-to-vent support

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_virtual_vehicle_time_to_vent_support.py'
      - '.github/workflows/audit-virtual-vehicle-time-to-vent-support.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas requests remotezip openpyxl
      - name: Audit time-to-vent support without fitting a predictor
        run: |
          rm -rf reports/external_virtual_vehicle_21700/time_to_vent_support
          python scripts/audit_virtual_vehicle_time_to_vent_support.py --out reports/external_virtual_vehicle_21700/time_to_vent_support
      - name: Commit support audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/external_virtual_vehicle_21700/time_to_vent_support
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: audit Virtual Vehicle time-to-vent support before scoring'
          git pull --rebase origin main
          git push origin HEAD:main
