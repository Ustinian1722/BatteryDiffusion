name: Evaluate class-matched Virtual Vehicle augmentation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/evaluate_virtual_vehicle_aug_fold_classmatched.py'
      - 'reports/virtual_vehicle_classmatched_correction_protocol.md'
      - '.github/workflows/evaluate-virtual-vehicle-classmatched.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fold:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {tag: A_BC, held: TS0330A, t1: TS0330B, t2: TS0330C, seed: 4101}
          - {tag: A_DE, held: TS0330A, t1: TS0330D, t2: TS0330E, seed: 4102}
          - {tag: A_FG, held: TS0330A, t1: TS0330F, t2: TS0330G, seed: 4103}
          - {tag: B_CD, held: TS0330B, t1: TS0330C, t2: TS0330D, seed: 4111}
          - {tag: B_EF, held: TS0330B, t1: TS0330E, t2: TS0330F, seed: 4112}
          - {tag: B_GH, held: TS0330B, t1: TS0330G, t2: TS0330H, seed: 4113}
          - {tag: C_DE, held: TS0330C, t1: TS0330D, t2: TS0330E, seed: 4121}
          - {tag: C_FG, held: TS0330C, t1: TS0330F, t2: TS0330G, seed: 4122}
          - {tag: C_HA, held: TS0330C, t1: TS0330H, t2: TS0330A, seed: 4123}
          - {tag: D_EF, held: TS0330D, t1: TS0330E, t2: TS0330F, seed: 4131}
          - {tag: D_GH, held: TS0330D, t1: TS0330G, t2: TS0330H, seed: 4132}
          - {tag: D_AB, held: TS0330D, t1: TS0330A, t2: TS0330B, seed: 4133}
          - {tag: E_FG, held: TS0330E, t1: TS0330F, t2: TS0330G, seed: 4141}
          - {tag: E_HA, held: TS0330E, t1: TS0330H, t2: TS0330A, seed: 4142}
          - {tag: E_BC, held: TS0330E, t1: TS0330B, t2: TS0330C, seed: 4143}
          - {tag: F_GH, held: TS0330F, t1: TS0330G, t2: TS0330H, seed: 4151}
          - {tag: F_AB, held: TS0330F, t1: TS0330A, t2: TS0330B, seed: 4152}
          - {tag: F_CD, held: TS0330F, t1: TS0330C, t2: TS0330D, seed: 4153}
          - {tag: G_HA, held: TS0330G, t1: TS0330H, t2: TS0330A, seed: 4161}
          - {tag: G_BC, held: TS0330G, t1: TS0330B, t2: TS0330C, seed: 4162}
          - {tag: G_DE, held: TS0330G, t1: TS0330D, t2: TS0330E, seed: 4163}
          - {tag: H_AB, held: TS0330H, t1: TS0330A, t2: TS0330B, seed: 4171}
          - {tag: H_CD, held: TS0330H, t1: TS0330C, t2: TS0330D, seed: 4172}
          - {tag: H_EF, held: TS0330H, t1: TS0330E, t2: TS0330F, seed: 4173}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests remotezip openpyxl scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare strict fold
        run: |
          mkdir -p work/vv_cm/${{ matrix.tag }}/fold out
          python scripts/prepare_virtual_vehicle_aug_fold.py \
            --heldout ${{ matrix.held }} --train ${{ matrix.t1 }} ${{ matrix.t2 }} \
            --out work/vv_cm/${{ matrix.tag }}/fold
      - name: Fit training-only RA-CDiff
        run: |
          python scripts/train_diffusion_v3_anchored.py \
            --input work/vv_cm/${{ matrix.tag }}/fold/train_generator.npz \
            --out work/vv_cm/${{ matrix.tag }}/syn \
            --steps 600 --diffusion-steps 100 --batch-size 64 --hidden 24 \
            --candidates 160 --noise-min 0.08 --noise-max 0.25 \
            --seed ${{ matrix.seed }}
      - name: Apply task guard and run class-matched comparison
        run: |
          python scripts/filter_virtual_vehicle_synthetic.py \
            --synthetic work/vv_cm/${{ matrix.tag }}/syn/synthetic_windows.npz \
            --train-real work/vv_cm/${{ matrix.tag }}/fold/train_real.npz \
            --out work/vv_cm/${{ matrix.tag }}/syn_task.npz --seed ${{ matrix.seed }} --temp-cap 150
          python scripts/evaluate_virtual_vehicle_aug_fold_classmatched.py \
            --fold-dir work/vv_cm/${{ matrix.tag }}/fold \
            --synthetic work/vv_cm/${{ matrix.tag }}/syn_task.npz \
            --out out/${{ matrix.tag }}.csv --seed ${{ matrix.seed }}
          cp out/${{ matrix.tag }}.json out/${{ matrix.tag }}_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: vv-cm-${{ matrix.tag }}
          path: out/
          retention-days: 2

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: vv-cm-*
          path: collected
          merge-multiple: true
      - name: Aggregate class-matched correction
        run: |
          rm -rf reports/virtual_vehicle_classmatched_correction
          mkdir -p reports/virtual_vehicle_classmatched_correction/fold_audits
          cp collected/*_audit.json reports/virtual_vehicle_classmatched_correction/fold_audits/
          python - <<'PY'
          from pathlib import Path
          import itertools, math, numpy as np, pandas as pd
          src=Path('collected'); out=Path('reports/virtual_vehicle_classmatched_correction')
          files=sorted(p for p in src.glob('*.csv'))
          df=pd.concat([pd.read_csv(p) for p in files],ignore_index=True)
          df.to_csv(out/'all_pair_metrics.csv',index=False)
          held=df.groupby(['heldout','method','representation']).agg(
              pair_count=('train_experiments','size'),auroc=('auroc','mean'),auprc=('auprc','mean'),
              f1=('f1','mean'),balanced_accuracy=('balanced_accuracy','mean'),
              aug_mean=('n_aug','mean'),aug_pos_mean=('n_aug_positive','mean')).reset_index()
          held.to_csv(out/'heldout_macro_over_pairs.csv',index=False)
          macro=held.groupby(['method','representation']).agg(
              auroc_mean=('auroc','mean'),auroc_worst=('auroc','min'),auprc_mean=('auprc','mean'),auprc_worst=('auprc','min'),
              f1_mean=('f1','mean'),balanced_acc_mean=('balanced_accuracy','mean')).reset_index()
          macro.to_csv(out/'macro_metrics.csv',index=False)

          # Paired held-out-experiment deltas for the headline fusion_absolute.
          h=held[held.representation.eq('fusion_absolute')].pivot(index='heldout',columns='method',values=['auroc','auprc','f1']).sort_index()
          rng=np.random.default_rng(20260912)
          rows=[]
          for a,b,label in [
              ('racdiff','real_only','racdiff-real_only'),
              ('classical_classmatched','real_only','classical-real_only'),
              ('racdiff','classical_classmatched','racdiff-classical_classmatched')]:
              for met in ('auroc','auprc'):
                  d=(h[(met,a)]-h[(met,b)]).to_numpy(float)
                  boots=np.asarray([np.mean(rng.choice(d,size=len(d),replace=True)) for _ in range(20000)])
                  lo,hi=np.quantile(boots,[.025,.975])
                  # exact sign-flip two-sided p-value on the mean statistic.
                  obs=abs(float(np.mean(d))); vals=[]
                  for signs in itertools.product((-1.,1.),repeat=len(d)):
                      vals.append(abs(float(np.mean(d*np.asarray(signs)))))
                  p=float(np.mean(np.asarray(vals)>=obs-1e-15))
                  rows.append({'contrast':label,'metric':met,'mean_delta':float(np.mean(d)),
                               'ci95_low':float(lo),'ci95_high':float(hi),
                               'improved_experiments':int((d>0).sum()),'n_experiments':len(d),'exact_signflip_p':p})
          stat=pd.DataFrame(rows); stat.to_csv(out/'paired_headline_statistics.csv',index=False)

          lines=['# Class-composition-matched Virtual Vehicle augmentation correction','',
                 'The predictive task, 24 predeclared folds, RA-CDiff generator, task guard, feature representations and classifier are unchanged. The only correction is that the classical comparator receives exactly the same retained synthetic negative/positive counts as RA-CDiff in each fold.','',
                 '| method | representation | mean AUROC | worst AUROC | mean AUPRC | worst AUPRC | mean F1 |','|---|---|---:|---:|---:|---:|---:|']
          for _,r in macro.iterrows():
              lines.append(f"| {r.method} | {r.representation} | {r.auroc_mean:.3f} | {r.auroc_worst:.3f} | {r.auprc_mean:.3f} | {r.auprc_worst:.3f} | {r.f1_mean:.3f} |")
          lines += ['', '## Headline paired statistics: fusion_absolute (n=8 real held-out experiments)','',
                    '| contrast | metric | mean delta | 95% bootstrap CI | improved | exact sign-flip p |','|---|---|---:|---:|---:|---:|']
          for _,r in stat.iterrows():
              lines.append(f"| {r.contrast} | {r.metric} | {r.mean_delta:+.3f} | [{r.ci95_low:+.3f}, {r.ci95_high:+.3f}] | {int(r.improved_experiments)}/{int(r.n_experiments)} | {r.exact_signflip_p:.4f} |")
          lines += ['', '## Guardrail','',
                    'This is a comparator-fairness correction, not a retuned task. Statistical n remains 8 independent destructive experiments.']
          (out/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit corrective study
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/virtual_vehicle_classmatched_correction
          git commit -m 'research: complete class-matched augmentation correction'
          git pull --rebase origin main
          git push origin HEAD:main
