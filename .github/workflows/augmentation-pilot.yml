name: Conditional diffusion augmentation pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/prepare_aug_windows.py'
      - 'scripts/train_diffusion_pilot.py'
      - '.github/workflows/augmentation-pilot.yml'

concurrency:
  group: augmentation-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diffusion-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Prepare homogeneous multimodal windows
        run: |
          rm -rf data/processed/augmentation_v1
          python scripts/prepare_aug_windows.py \
            --root data/raw/osf_c2hnq \
            --out data/processed/augmentation_v1 \
            --window 256 \
            --stride 64
          cat data/processed/augmentation_v1/cohort_summary.csv

      - name: Train age-stage conditional diffusion and generate candidates
        run: |
          rm -rf data/synthetic/pilot_cell_2170
          python scripts/train_diffusion_pilot.py \
            --input data/processed/augmentation_v1/cell_2170_temp_pressure.npz \
            --out data/synthetic/pilot_cell_2170 \
            --steps 800 \
            --diffusion-steps 60 \
            --batch-size 64 \
            --hidden 32 \
            --candidates 256 \
            --seed 2026
          cat data/synthetic/pilot_cell_2170/pilot_report.md

      - name: Remove checkpoint before commit
        run: rm -f data/synthetic/pilot_cell_2170/pilot_model.pt

      - name: Commit prepared and augmented pilot data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/augmentation_v1 data/synthetic/pilot_cell_2170
          if git diff --cached --quiet; then
            echo 'No augmentation changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh age-stage conditional diffusion augmentation pilot'
          # The workflow can overlap with audit commits. Rebase before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
