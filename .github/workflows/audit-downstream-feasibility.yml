name: Audit impending-vent early-warning feasibility

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_early_warning_task.py'
      - '.github/workflows/audit-downstream-feasibility.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - name: Count causal pre-vent windows
        run: |
          rm -rf reports/downstream_feasibility
          python scripts/audit_early_warning_task.py --stride 10
          cat reports/downstream_feasibility/README.md
      - name: Commit feasibility audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/downstream_feasibility
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: audit impending-vent early-warning task support'
          git pull --rebase origin main
          git push origin HEAD:main
