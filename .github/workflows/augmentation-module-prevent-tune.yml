name: Tune module RA-CDiff for pre-vent locality

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/augmentation-module-prevent-tune.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train ultra-local module RA-CDiff
        run: |
          rm -rf data/synthetic/module_racdiff_v3_prevent reports/augmentation_quality_module_v3_prevent
          python scripts/train_diffusion_v3_anchored.py \
            --input data/processed/module_aligned_v1/module_temp4_force.npz \
            --out data/synthetic/module_racdiff_v3_prevent \
            --steps 1200 --diffusion-steps 100 --batch-size 64 --hidden 32 \
            --candidates 360 --noise-min 0.03 --noise-max 0.15 --seed 2028
          python scripts/evaluate_augmentation_quality.py \
            --real data/processed/module_aligned_v1/module_temp4_force.npz \
            --synthetic data/synthetic/module_racdiff_v3_prevent/synthetic_windows.npz \
            --quality-csv data/synthetic/module_racdiff_v3_prevent/synthetic_quality.csv \
            --pilot-json data/synthetic/module_racdiff_v3_prevent/report.json \
            --out reports/augmentation_quality_module_v3_prevent
          cat data/synthetic/module_racdiff_v3_prevent/report.md
          cat reports/augmentation_quality_module_v3_prevent/augmentation_quality.md
          cat reports/augmentation_quality_module_v3_prevent/gate_diagnostics.csv
          rm -f data/synthetic/module_racdiff_v3_prevent/model.pt
      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/synthetic/module_racdiff_v3_prevent reports/augmentation_quality_module_v3_prevent
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: add pre-vent-local module RA-CDiff tuning'
          git pull --rebase origin main
          git push origin HEAD:main
