name: Audit problem mechanical channels

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_problem_channels.py'
      - '.github/workflows/audit-problem-channels.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas openpyxl
      - run: python scripts/audit_problem_channels.py
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/problem_channel_audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: audit suspicious mechanical channels'
          git pull --rebase origin main
          git push origin HEAD:main
