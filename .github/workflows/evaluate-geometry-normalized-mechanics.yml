name: Evaluate geometry-normalized mechanical features

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/evaluate_geometry_normalized_mechanics.py'
      - '.github/workflows/evaluate-geometry-normalized-mechanics.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas openpyxl scikit-learn
      - name: Run representation diagnostic
        run: |
          rm -rf reports/geometry_normalized_mechanics
          python scripts/evaluate_geometry_normalized_mechanics.py --out reports/geometry_normalized_mechanics
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/geometry_normalized_mechanics
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: evaluate geometry-normalized mechanical features'
          git pull --rebase origin main
          git push origin HEAD:main
