name: Audit Virtual Vehicle augmentation results

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_virtual_vehicle_aug_results.py'
      - '.github/workflows/audit-virtual-vehicle-augmentation-results.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas
      - name: Audit class coverage and paired statistics
        run: python scripts/audit_virtual_vehicle_aug_results.py --root reports/virtual_vehicle_aug_utility
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/virtual_vehicle_aug_utility
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: audit synthetic class coverage and paired effects'
          git pull --rebase origin main
          git push origin HEAD:main
