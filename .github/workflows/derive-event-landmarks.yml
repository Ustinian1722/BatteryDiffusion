name: Derive TR event landmarks

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/derive_event_landmarks.py'
      - '.github/workflows/derive-event-landmarks.yml'

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas openpyxl
      - name: Derive event landmarks
        run: |
          rm -rf reports/event_landmarks
          python scripts/derive_event_landmarks.py
          cat reports/event_landmarks/README.md
      - name: Commit event audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/event_landmarks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: add TR event landmark audit'
          git pull --rebase origin main
          git push origin HEAD:main
