name: Unpack and audit OSF thermal-runaway dataset

on:
  workflow_dispatch:
  push:
    paths:
      - 'c2hnq-osfstorage-archive.zip'
      - 'scripts/audit_dataset.py'
      - '.github/workflows/unpack-and-audit-dataset.yml'

permissions:
  contents: write

jobs:
  unpack-audit-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: python -m pip install --upgrade pip pandas numpy openpyxl

      - name: Extract archive recursively
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/raw/osf_c2hnq
          mkdir -p data/raw/osf_c2hnq reports
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, is_zipfile

          root = Path('data/raw/osf_c2hnq').resolve()
          outer = Path('c2hnq-osfstorage-archive.zip')

          def safe_extract(zip_path: Path, out_dir: Path):
              out_dir = out_dir.resolve()
              out_dir.mkdir(parents=True, exist_ok=True)
              with ZipFile(zip_path) as zf:
                  for member in zf.infolist():
                      name = member.filename.replace('\\', '/')
                      if name.startswith('__MACOSX/') or '/__MACOSX/' in name:
                          continue
                      dest = (out_dir / name).resolve()
                      if out_dir not in dest.parents and dest != out_dir:
                          raise RuntimeError(f'Unsafe ZIP member: {name}')
                      zf.extract(member, out_dir)

          safe_extract(outer, root)

          while True:
              nested = [p for p in root.rglob('*.zip') if p.is_file() and is_zipfile(p)]
              if not nested:
                  break
              for z in nested:
                  target = z.with_suffix('')
                  safe_extract(z, target)
                  z.unlink()
          PY

      - name: Create basic file tree
        shell: bash
        run: |
          set -euo pipefail
          find data/raw/osf_c2hnq -type f | sort > reports/raw_dataset_tree.txt
          python - <<'PY'
          from pathlib import Path
          root = Path('data/raw/osf_c2hnq')
          files = [p for p in root.rglob('*') if p.is_file()]
          tabular = [p for p in files if p.suffix.lower() in {'.csv', '.xlsx', '.xls'}]
          total_bytes = sum(p.stat().st_size for p in files)
          Path('reports/raw_dataset_audit.md').write_text(
              '# Raw dataset audit\n\n'
              f'- Extracted files: **{len(files)}**\n'
              f'- Tabular signal files: **{len(tabular)}**\n'
              f'- Total extracted size: **{total_bytes:,} bytes**\n\n'
              'Detailed experiment and signal audits are generated by `scripts/audit_dataset.py`.\n',
              encoding='utf-8'
          )
          PY

      - name: Run detailed dataset audit
        run: python scripts/audit_dataset.py --root data/raw/osf_c2hnq --out reports

      - name: Commit extracted dataset and audits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/osf_c2hnq reports
          if git diff --cached --quiet; then
            echo 'No dataset changes to commit.'
            exit 0
          fi
          git commit -m 'data: unpack dataset and refresh experiment-level audit'
          git push origin HEAD:main
